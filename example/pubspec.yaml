name: murkio_identity_example
description: The smallest app that signs in with murkio_identity.
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  murkio_identity:
    path: ..

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0" # 6.x needs Dart 3.8; the oldest supported Flutter has 3.7

flutter:
  uses-material-design: true
